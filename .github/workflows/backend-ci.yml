name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing
      - name: Migrations match the models
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: uv run alembic upgrade head && uv run alembic check
      - name: OpenAPI snapshot is up to date
        run: |
          uv run python -m friends_api.cli export-openapi
          git diff --exit-code -- openapi.json || {
            echo "::error::backend/openapi.json is stale. Run: uv run python -m friends_api.cli export-openapi"
            exit 1
          }
