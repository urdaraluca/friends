name: app-ci

on:
  pull_request:
    paths:
      - "app/**"
      - "backend/openapi.json"
      - ".github/workflows/app-ci.yml"
      - ".github/actions/flutter-setup/**"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "backend/openapi.json"
      - ".github/workflows/app-ci.yml"
      - ".github/actions/flutter-setup/**"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Also compile iOS (no codesign, macOS runner)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5" # also used by backend-image.yml

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          build-runner: "false" # the drift check below runs first
      # Before build_runner, so only the committed swagger_parser output is compared
      # (*.g.dart / *.freezed.dart are gitignored and don't exist yet). The directory is emptied
      # first because swagger_parser never deletes files: a stale one then shows up as deleted.
      - name: Generated API client matches backend/openapi.json
        run: |
          rm -rf lib/core/api/generated
          dart run swagger_parser
          if ! git diff --exit-code -- lib/core/api/generated \
            || [ -n "$(git status --porcelain --untracked-files=all -- lib/core/api/generated)" ]; then
            git status --short -- lib/core/api/generated
            echo "::error::lib/core/api/generated is stale. Run in app/: dart run swagger_parser, then commit the result."
            exit 1
          fi
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Format
        run: >
          dart format --output=none --set-exit-if-changed
          $(find lib test -name '*.dart' ! -name '*.g.dart' ! -name '*.freezed.dart' ! -path 'lib/core/api/generated/*')
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: app/coverage/lcov.info
          retention-days: 7

  build-web:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter build web --release --no-web-resources-cdn --dart-define-from-file=env/prod.json
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: app/build/web
          retention-days: 14

  build-android:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          # Caches ~/.gradle/caches and ~/.gradle/wrapper. The key covers the Gradle build files,
          # the wrapper version and pubspec.lock (Flutter plugins add Android dependencies).
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/app/*.gradle*
            app/android/gradle/wrapper/gradle-wrapper.properties
            app/pubspec.lock
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter build apk --debug --dart-define-from-file=env/dev.emulator.json
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  build-ios:
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter build ios --release --no-codesign --dart-define-from-file=env/prod.json
