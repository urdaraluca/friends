name: app-ci

on:
  pull_request:
    paths:
      - "app/**"
      - "backend/openapi.json"
      - ".github/workflows/app-ci.yml"
      - ".github/actions/flutter-setup/**"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "backend/openapi.json"
      - ".github/workflows/app-ci.yml"
      - ".github/actions/flutter-setup/**"
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Also compile iOS (no codesign, macOS runner)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Format
        run: >
          dart format --output=none --set-exit-if-changed
          $(find lib test -name '*.dart' ! -name '*.g.dart' ! -name '*.freezed.dart' ! -path 'lib/core/api/generated/*')
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: app/coverage/lcov.info
          retention-days: 7

  build-web:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter build web --release --no-web-resources-cdn --dart-define-from-file=env/prod.json
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: app/build/web
          retention-days: 14

  build-android:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter build apk --debug --dart-define-from-file=env/dev.emulator.json
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  build-ios:
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter build ios --release --no-codesign --dart-define-from-file=env/prod.json
