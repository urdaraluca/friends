name: backend-image

# Builds the linux/arm64 image for the Raspberry Pi on a native arm64 runner (no QEMU)
# and pushes it to GHCR. Pull requests only build (no push).
on:
  push:
    branches: [main]
    tags: ["backend-v*"] # path filters are not evaluated for tag pushes
    paths:
      - "backend/**"
      - ".github/workflows/backend-*.yml"
  pull_request:
    paths:
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/docker-entrypoint.sh"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/friends-backend

jobs:
  ci:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/backend-ci.yml

  build:
    needs: ci
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=match,pattern=backend-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=backend-v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/backend-v') }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64
      - name: Smoke test the image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          ref="$(echo "$TAGS" | head -n1)"
          docker run -d --name smoke -e JWT_SECRET="$(openssl rand -base64 48)" -p 8000:8000 "$ref"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then echo; docker rm -f smoke; exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
