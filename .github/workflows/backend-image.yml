name: backend-image

# Builds the linux/arm64 image for the Raspberry Pi on a native arm64 runner (no QEMU), smoke tests
# it locally and only then pushes it to GHCR, so a broken image never gets a tag there (`latest`
# included). Pull requests only build and smoke test (no push).
# The image also serves the Flutter web app (contract section 1.1): it is built on x64 and passed
# into the image as the `web` named build context.
on:
  push:
    branches: [main]
    tags: ["backend-v*"] # path filters are not evaluated for tag pushes
    paths:
      - "backend/**"
      - "app/**"
      - ".github/workflows/backend-*.yml"
      - ".github/actions/flutter-setup/**"
      - "!**/*.md"
  pull_request:
    paths:
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/docker-entrypoint.sh"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "app/**"
      - ".github/workflows/backend-image.yml"
      - ".github/actions/flutter-setup/**"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/friends-backend
  SMOKE_IMAGE: friends-backend:smoke # local only, never pushed
  FLUTTER_VERSION: "3.47.5" # keep in sync with app-ci.yml

jobs:
  ci:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/backend-ci.yml

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Build the web app (same origin, API_BASE_URL="")
        working-directory: app
        run: flutter build web --release --no-web-resources-cdn --dart-define-from-file=env/prod.json
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: app/build/web
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [ci, web]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=match,pattern=backend-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=backend-v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/backend-v') }}
      # Loaded into the local Docker only: nothing is pushed before the smoke test passes.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: backend
          # Overrides the Dockerfile's `web` stage with the Flutter build.
          build-contexts: web=./web-dist
          platforms: linux/arm64
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name smoke -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e PUBLIC_APP_URL=https://friends.example.com -p 8000:8000 "$SMOKE_IMAGE"
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker logs smoke; fi; docker rm -f smoke >/dev/null' EXIT
          base=http://127.0.0.1:8000
          out="$RUNNER_TEMP/smoke"; mkdir -p "$out"

          healthy=
          for _ in $(seq 1 30); do
            if curl -fsS "$base/api/v1/health"; then echo; healthy=1; break; fi
            sleep 1
          done
          [ -n "$healthy" ] || { echo "::error::/api/v1/health never answered 200"; exit 1; }

          # The web app, including an SPA deep link (invite link).
          curl -fsS -o "$out/join.html" "$base/join/ABCDEFGHJK"
          grep -q flutter_bootstrap "$out/join.html" || { echo "::error::/join/... is not the Flutter app shell"; exit 1; }

          # The files the app shell loads are in the image, and every file is revalidated (Flutter's
          # file names carry no content hash, contract section 1.1).
          for f in flutter_bootstrap.js main.dart.js; do
            curl -fsS -o /dev/null -D "$out/$f.headers" "$base/$f" || { echo "::error::/$f is not served"; exit 1; }
            grep -qi '^cache-control: no-cache' "$out/$f.headers" || { echo "::error::/$f is not sent with Cache-Control: no-cache"; exit 1; }
          done

          # Unknown API paths are a problem+json 404, never the app shell.
          code="$(curl -sS -o "$out/nope.json" -D "$out/nope.headers" -w '%{http_code}' "$base/api/v1/nope")"
          [ "$code" = 404 ] || { echo "::error::/api/v1/nope returned $code, expected 404"; exit 1; }
          grep -qi '^content-type: application/problem+json' "$out/nope.headers"
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["code"] == "not_found"' "$out/nope.json"
          echo "Smoke test passed"
      # The same inputs as "Build the image", so every step comes from the builder's cache and this
      # pushes the image that was just tested.
      - name: Push the tested image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: backend
          build-contexts: web=./web-dist
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend-arm64
