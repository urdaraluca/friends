name: flutter-setup
description: Install Flutter, fetch packages and run code generation for app/
inputs:
  flutter-version:
    description: Flutter SDK version
    required: true
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: true
    - shell: bash
      working-directory: app
      run: |
        flutter --version
        flutter pub get
        dart run build_runner build --delete-conflicting-outputs
