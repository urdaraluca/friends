name: friends
description: "Friends: plan activities with your friend groups."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.0
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.4.0
  retrofit: ^4.10.0
  riverpod_annotation: ^4.0.7
  share_plus: ^13.0.0
  shared_preferences: ^2.5.5
  table_calendar: ^3.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  retrofit_generator: ^10.2.11
  riverpod_generator: ^4.0.9
  swagger_parser: ^1.44.3
  very_good_analysis: ^11.0.0
flutter:
  uses-material-design: true

# App icons for Android (adaptive too), iOS and web, from assets/icon/.
# Redraw with tool/make_icon.py, then run: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#FF7A59"
  adaptive_icon_foreground: assets/icon/foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#FF7A59"
    theme_color: "#FF7A59"
