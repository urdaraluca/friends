include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/core/api/generated/**"
    - "test/core/api/spike/generated/**"
    - build/**
    - android/**
    - ios/**
    - web/**
  errors:
    # freezed puts @JsonKey on constructor parameters
    invalid_annotation_target: ignore

linter:
  rules:
    public_member_api_docs: false

plugins:
  riverpod_lint: ^3.1.9
